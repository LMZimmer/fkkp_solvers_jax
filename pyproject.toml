[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fisher-kpp-jax"
version = "0.1.0"
description = "Fisher-KPP tumor growth forward solvers in JAX."
authors = ["Lucas Zimmer <zimmer.lucas.w@gmail.com>"]
packages = [{ include = "fisher_kpp_jax" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
jax = ">=0.11.0"
loguru = ">=0.7.0"
nibabel = ">=5.0.0"
numpy = ">=2.0.0"
scipy = ">=1.14.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[tool.pytest.ini_options]
pythonpath = ["."]
